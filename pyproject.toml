[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexportal-gate"
version = "0.1.0"
description = "A readiness gate at two positions of NexPortal's operating model: intake at the door, gate before refinement."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
nexportal-gate = "nexportal_gate.__main__:main"

[tool.setuptools.packages.find]
include = ["nexportal_gate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
